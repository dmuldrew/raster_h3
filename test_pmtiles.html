<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PMTiles Hawaii Hexagon Viewer Test</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #debug { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px; font-family: monospace; z-index: 999; max-width: 400px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="debug">Loading PMTiles...</div>
  <div id="map"></div>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const p = new pmtiles.PMTiles("/data/CFL_HI_pyramid.pmtiles");
    protocol.add(p);

    p.getHeader().then(h => {
      document.getElementById("debug").innerHTML = `<b>PMTiles Header:</b><br>
        Zoom: ${h.minZoom} - ${h.maxZoom}<br>
        Bounds: [${h.minLon.toFixed(3)}, ${h.minLat.toFixed(3)}, ${h.maxLon.toFixed(3)}, ${h.maxLat.toFixed(3)}]<br>
        Center: [${h.centerLon.toFixed(3)}, ${h.centerLat.toFixed(3)}], Z${h.centerZoom}<br>
        Tiles: ${h.numAddressedTiles}<br>
        Tile Type: ${h.tileType}, Compression: ${h.tileCompression}`;
    }).catch(e => {
      document.getElementById("debug").innerHTML = `<span style="color:red">Error reading header: ${e.message}</span>`;
    });

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap'
          },
          'h3_source': {
            type: 'vector',
            url: 'pmtiles:///data/CFL_HI_pyramid.pmtiles'
          }
        },
        layers: [
          {
            id: 'osm_base',
            type: 'raster',
            source: 'osm',
            minzoom: 0,
            maxzoom: 19
          },
          {
            id: 'h3_fill',
            type: 'fill',
            source: 'h3_source',
            'source-layer': 'h3_hexagons',
            paint: {
              'fill-color': [
                'interpolate',
                ['linear'],
                ['get', 'mean'],
                0, 'rgba(0, 0, 0, 0.05)',
                1, '#fee391',
                5, '#fe9929',
                20, '#d95f0e',
                50, '#990000'
              ],
              'fill-opacity': 0.7
            }
          },
          {
            id: 'h3_line',
            type: 'line',
            source: 'h3_source',
            'source-layer': 'h3_hexagons',
            paint: {
              'line-color': '#333333',
              'line-width': 1,
              'line-opacity': 0.5
            }
          }
        ]
      },
      center: [-157.8, 20.8],
      zoom: 7
    });

    map.on('error', (e) => {
      console.error("Map error:", e);
      document.getElementById("debug").innerHTML += `<br><span style="color:orange">Map error: ${e.error ? e.error.message : JSON.stringify(e)}</span>`;
    });

    map.on('load', () => {
      document.getElementById("debug").innerHTML += `<br><span style="color:lime">Map loaded successfully</span>`;
    });
  </script>
</body>
</html>
