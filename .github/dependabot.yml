version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # parquet >= 60 writes IEEE_754_TOTAL_ORDER column orders that Polars cannot read; see
      # the note on the workspace `parquet` dependency before lifting this.
      - dependency-name: parquet
        versions: ['>= 60']
    groups:
      # One PR for semver-compatible bumps; majors still arrive individually.
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Refs like `@1.94` select the MSRV toolchain, not an action release.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /crates/raster-h3-python
    schedule:
      interval: monthly
