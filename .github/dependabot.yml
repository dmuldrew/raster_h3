version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for semver-compatible bumps; majors still arrive individually.
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Refs like `@1.94` select the MSRV toolchain, not an action release.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /crates/raster-h3-python
    schedule:
      interval: monthly
