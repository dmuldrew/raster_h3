name: Hotspot Profile

# Optional manual run; prefer local profiling on stable hardware for comparisons.
# Measures mosaic tile-scan scaling and nested-Rayon wave dispatch (see
# crates/raster-h3-core/examples/profile_hotspots.rs). Results go to the job
# summary, `::notice` annotations and a JSON artifact. Wall times on hosted
# runners are noisy; allocator peaks and counts can also vary with scheduling.

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Smaller sizes for a fast smoke run'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test ownership sampling
        run: cargo test --locked --release -p raster-h3-core --example profile_hotspots
      - name: Run hotspot profile
        env:
          QUICK: ${{ inputs.quick && '--quick' || '' }}
        run: |
          nproc
          cargo run --locked --release -p raster-h3-core --example profile_hotspots -- ${QUICK:+"$QUICK"} --json profile.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotspot-profile-${{ github.sha }}
          path: profile.json
