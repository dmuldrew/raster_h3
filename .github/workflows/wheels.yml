name: Python Wheels

# Builds one `py3-none-<platform>` wheel per platform (Python/Polars bindings + the
# raster-h3-cli executable) and smoke-tests each after install. Configuration lives in
# crates/raster-h3-python/pyproject.toml under [tool.cibuildwheel]. No publishing yet.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Skips the build on pull requests and pushes that only touch documentation. Skipped
  # jobs count as passing, so this stays compatible with required status checks. Tag
  # pushes and manual runs always build.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' || steps.filter.outputs.wheel_readme == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        with:
          # A file counts as code unless it matches one of the documentation patterns.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!LICENSE'
            # Packaged as the wheel's readme (pyproject.toml)
            wheel_readme:
              - 'crates/raster-h3-python/README.md'

  wheels:
    name: Wheels (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux x86_64
            os: ubuntu-24.04
          - name: manylinux aarch64
            os: ubuntu-24.04-arm
          # macOS arm64 natively plus x86_64 cross-compiled (tested under Rosetta).
          - name: macOS arm64 + x86_64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux builds install Rust inside the manylinux container (before-all).
      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Build and test wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: crates/raster-h3-python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
