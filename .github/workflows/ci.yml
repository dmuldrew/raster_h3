name: CI & Extension Build Matrix

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Skips the build on pull requests and pushes that only touch documentation. Skipped
  # jobs count as passing, so this stays compatible with required status checks. Tag
  # pushes and manual runs always build.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      wheels: ${{ startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.code == 'true' || steps.filter.outputs.wheel_readme == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        with:
          # A file counts as code unless it matches one of the documentation patterns.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!LICENSE'
            wheel_readme:
              - 'crates/raster-h3-python/README.md'

  lint:
    name: Format, Clippy & Docs
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Compiles the feature-gated PostgreSQL module without a local server install.
      RASTER_H3_PG_MAJOR: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (pg-extension)
        run: cargo clippy -p raster-h3-pg --features pg-extension --all-targets --locked -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV (rust-version)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with `rust-version` in the root Cargo.toml.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.94'

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check --workspace --all-targets --locked

  build:
    name: Build & Package (${{ matrix.platform }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # DuckDB v1.2 tags its glibc x86_64 builds linux_amd64_gcc4; v1.3+ and v2.0+ use linux_amd64 (both are packaged below)
            platform: linux_amd64_gcc4
            lib_file: libraster_h3.so
            cli_arch: linux-amd64
            cli_sha256: 5221744caf224994bf563bff8e8bd039a9b63437ef05ccfdcc14d2c1cece8d3e
            cli_v156_sha256: 6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f
            cli_v200_sha256: c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            lib_file: libraster_h3.so
            cli_arch: linux-aarch64
            cli_sha256: 324bd819153c685b7e8153e73d34cbd590b48e096680fd68c8b16a7035206323
            cli_v156_sha256: c544e92c9b7c31fc53c2139802cabd8e2d1b2b3e3f933117f31611239c1402db
            cli_v200_sha256: 859e1875d2a9515fbb4bf8871061437a14af82320da68c753f094c4b776348fe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: osx_arm64
            lib_file: libraster_h3.dylib
            cli_arch: osx-universal
            cli_sha256: 09c57c5065decc254f64e51e7b1de94d262ec13fcd8d1a96a16f08f67ee2ed9f
            cli_v156_sha256: 80a80c68736bd7dea53e8b02447e9759db0c8596ea156476ba396c44f54c5810
            cli_v200_sha256: 8a8f67e7c7f7d1392fa63ba3971948391392fe2a25fca63e7008e33c50beb4c2
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: osx_amd64
            lib_file: libraster_h3.dylib
            cli_arch: osx-universal
            cli_sha256: 09c57c5065decc254f64e51e7b1de94d262ec13fcd8d1a96a16f08f67ee2ed9f
            cli_v156_sha256: 80a80c68736bd7dea53e8b02447e9759db0c8596ea156476ba396c44f54c5810
            cli_v200_sha256: 8a8f67e7c7f7d1392fa63ba3971948391392fe2a25fca63e7008e33c50beb4c2
            # Cross-compiled on an arm64 runner: run the universal CLI's x86_64 slice
            cli_prefix: arch -x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            lib_file: raster_h3.dll
            cli_arch: windows-amd64
            cli_sha256: 3f3194799c1f289ff570cef9191168ea5d6743202d4445dd6d5ee669a8586435
            cli_v156_sha256: 798eae475d07c645ff3b914f7b0e676d06502b5412dd7552638fafed81f9e916
            cli_v200_sha256: 91663c2f36c2a334b0e5e639006d8c29c29e013af0c477d80bb931df68870312
    permissions:
      contents: read
    env:
      LIB_NAME: ${{ matrix.lib_file }}
      # SHA-256 of DuckDB v1.2.0's libduckdb-windows-amd64.zip
      LIBDUCKDB_WINDOWS_SHA256: 6327f8443ff8744a6753819e1ca874a82f1944a603d6dbc3bc564dada39b6337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Configure macOS Linker Flags
        if: runner.os == 'macOS'
        run: |
          echo "RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> $GITHUB_ENV

      - name: Setup DuckDB Import Library (Windows MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/duckdb_lib
          curl --retry 5 --retry-max-time 600 --connect-timeout 30 --max-time 180 -fsSLO https://github.com/duckdb/duckdb/releases/download/v1.2.0/libduckdb-windows-amd64.zip
          scripts/verify_sha256.sh libduckdb-windows-amd64.zip "$LIBDUCKDB_WINDOWS_SHA256"
          unzip -o -q libduckdb-windows-amd64.zip -d target/duckdb_lib
          WIN_LIB_DIR=$(cygpath -w "$(pwd)/target/duckdb_lib")
          echo "LIB=$WIN_LIB_DIR;$LIB" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L native=$WIN_LIB_DIR" >> $GITHUB_ENV
          echo "$(pwd)/target/duckdb_lib" >> $GITHUB_PATH
          mkdir -p target/release/deps
          cp target/duckdb_lib/duckdb.dll target/release/deps/ || true
          cp target/duckdb_lib/duckdb.dll target/release/ || true
          cp target/duckdb_lib/duckdb.dll . || true

      # Root (cross-engine/packaging), core and DuckDB integration binaries plus
      # their unit tests; each crate links a single tests/it binary.
      - name: Run Tests
        run: cargo test --locked --release --no-fail-fast -p raster_h3 -p raster-h3-core -p raster-h3-duckdb

      - name: Test hotspot harness ownership sampling
        run: cargo test --locked --release -p raster-h3-core --example profile_hotspots

      - name: Test worker-scaling benchmark output equality
        run: cargo test --locked --release -p raster-h3-core --example worker_scaling

      - name: Build Dynamic Library & Binaries
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package DuckDB Extension (Uncompressed & Gzipped)
        shell: bash
        env:
          DUCKDB_EXTENSION_SIGNING_KEY: ${{ secrets.DUCKDB_EXTENSION_SIGNING_KEY }}
        run: |
          cargo run --release --bin package_extension -- \
            --input target/${{ matrix.target }}/release/${{ matrix.lib_file }} \
            --output target/${{ matrix.target }}/release/raster_h3.duckdb_extension \
            --platform ${{ matrix.platform }} \
            --duckdb-version v1.2.0

          cargo run --release --bin package_extension -- \
            --input target/${{ matrix.target }}/release/${{ matrix.lib_file }} \
            --output target/${{ matrix.target }}/release/raster_h3.duckdb_extension.gz \
            --platform ${{ matrix.platform }} \
            --duckdb-version v1.2.0 \
            --gzip

          # Create platform-tagged files for direct release asset downloads
          cp target/${{ matrix.target }}/release/raster_h3.duckdb_extension target/${{ matrix.target }}/release/raster_h3-${{ matrix.platform }}.duckdb_extension
          cp target/${{ matrix.target }}/release/raster_h3.duckdb_extension.gz target/${{ matrix.target }}/release/raster_h3-${{ matrix.platform }}.duckdb_extension.gz

          # Stage repository layout: dist/v1.2.0/<platform>/raster_h3.duckdb_extension[.gz]
          mkdir -p dist/v1.2.0/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/raster_h3.duckdb_extension dist/v1.2.0/${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/raster_h3.duckdb_extension.gz dist/v1.2.0/${{ matrix.platform }}/

          # On Linux x86_64, also package under the `linux_amd64` platform tag used by DuckDB v1.3+ and v2.0+
          if [[ "${{ matrix.platform }}" == "linux_amd64_gcc4" ]]; then
            mkdir -p dist/v1.2.0/linux_amd64
            cargo run --release --bin package_extension -- \
              --input target/${{ matrix.target }}/release/${{ matrix.lib_file }} \
              --output dist/v1.2.0/linux_amd64/raster_h3.duckdb_extension \
              --platform linux_amd64 \
              --duckdb-version v1.2.0
            cargo run --release --bin package_extension -- \
              --input target/${{ matrix.target }}/release/${{ matrix.lib_file }} \
              --output dist/v1.2.0/linux_amd64/raster_h3.duckdb_extension.gz \
              --platform linux_amd64 \
              --duckdb-version v1.2.0 \
              --gzip
            cp dist/v1.2.0/linux_amd64/raster_h3.duckdb_extension target/${{ matrix.target }}/release/raster_h3-linux_amd64.duckdb_extension
            cp dist/v1.2.0/linux_amd64/raster_h3.duckdb_extension.gz target/${{ matrix.target }}/release/raster_h3-linux_amd64.duckdb_extension.gz
          fi

          # DuckDB requests `<prefix>/<its own version>/<platform>/...` from a repository, so DuckDB 2.0
          # (`INSTALL raster_h3 FROM <repo>`) needs a v2.0.0 tree. Its Linux x86_64 tag is linux_amd64.
          # The v2.0.0 tree ships a separate build against the v1.5.6 C extension API, enabling
          # DuckDB file-system access, COPY output, session options and scalar bind/init.
          V2_PLATFORM="${{ matrix.platform }}"
          if [[ "$V2_PLATFORM" == "linux_amd64_gcc4" ]]; then
            V2_PLATFORM=linux_amd64
          fi
          mkdir -p "dist/v2.0.0/$V2_PLATFORM"

          CARGO_TARGET_DIR=target-v156 cargo build --locked --release --target ${{ matrix.target }} \
            -p raster_h3 --lib --features duckdb-api-v1_5_6

          cargo run --release --bin package_extension -- \
            --input target-v156/${{ matrix.target }}/release/${{ matrix.lib_file }} \
            --output "dist/v2.0.0/$V2_PLATFORM/raster_h3.duckdb_extension" \
            --platform "$V2_PLATFORM" \
            --duckdb-version v1.5.6

          cargo run --release --bin package_extension -- \
            --input target-v156/${{ matrix.target }}/release/${{ matrix.lib_file }} \
            --output "dist/v2.0.0/$V2_PLATFORM/raster_h3.duckdb_extension.gz" \
            --platform "$V2_PLATFORM" \
            --duckdb-version v1.5.6 \
            --gzip

          # Signed builds must verify before they are uploaded for release
          if [[ -n "${DUCKDB_EXTENSION_SIGNING_KEY:-}" ]]; then
            for ext in dist/v*/*/raster_h3.duckdb_extension*; do
              cargo run --release --bin package_extension -- --verify "$ext"
            done
          fi

      - name: Verify Extension Loading with DuckDB CLI
        if: matrix.cli_arch != ''
        shell: bash
        run: |
          CLI_URL="https://github.com/duckdb/duckdb/releases/download/v1.2.0/duckdb_cli-${{ matrix.cli_arch }}.zip"
          echo "Downloading DuckDB CLI from $CLI_URL..."
          curl --retry 5 --retry-max-time 600 --connect-timeout 30 --max-time 180 -fsSLO "$CLI_URL"
          scripts/verify_sha256.sh "duckdb_cli-${{ matrix.cli_arch }}.zip" "${{ matrix.cli_sha256 }}"
          unzip -o -q "duckdb_cli-${{ matrix.cli_arch }}.zip"
          
          DUCKDB_BIN="./duckdb"
          EXT_PATH="$(pwd)/target/${{ matrix.target }}/release/raster_h3.duckdb_extension"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DUCKDB_BIN="./duckdb.exe"
            cp target/duckdb_lib/duckdb.dll . || true
            # DuckDB needs a native path (D:/...), not Git Bash's /d/...
            EXT_PATH="$(cygpath -m "$EXT_PATH")"
          fi
          
          chmod +x $DUCKDB_BIN || true
          if [[ -n "${{ matrix.cli_prefix }}" ]]; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          ${{ matrix.cli_prefix }} $DUCKDB_BIN -unsigned -bail -c "LOAD '$EXT_PATH'; SELECT h3_to_string(599686042433355775) AS cell_h3;"
          echo "Smoke test passed successfully on ${{ matrix.platform }}!"

      # Runs real export SQL through the CLI downloaded above. Uses the host-built
      # library so it matches the CLI's platform (osx_amd64 cross-compiles on arm64).
      - name: Run DuckDB SQL Smoke Test
        if: matrix.cli_arch != ''
        shell: bash
        run: |
          DUCKDB_BIN="$(pwd)/duckdb"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DUCKDB_BIN="$(cygpath -w "$(pwd)/duckdb.exe")"
          fi
          export DUCKDB_BIN
          cargo build --release --lib
          cargo test --release -p raster_h3 --test it duckdb_sql_smoke -- --ignored

      - name: Run DuckDB 1.5.6 SQL Smoke Test
        if: matrix.cli_arch != ''
        shell: bash
        run: |
          mkdir -p duckdb-1.5
          CLI_ARCH="${{ matrix.cli_arch }}"
          if [[ "$CLI_ARCH" == "linux-aarch64" ]]; then
            CLI_ARCH="linux-arm64"
          fi
          CLI_URL="https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-${CLI_ARCH}.zip"
          echo "Downloading DuckDB CLI from $CLI_URL..."
          curl --retry 5 --retry-max-time 600 --connect-timeout 30 --max-time 180 -fsSL "$CLI_URL" -o "duckdb-1.5/duckdb_cli-${CLI_ARCH}.zip"
          scripts/verify_sha256.sh "duckdb-1.5/duckdb_cli-${CLI_ARCH}.zip" "${{ matrix.cli_v156_sha256 }}"
          unzip -o -q "duckdb-1.5/duckdb_cli-${CLI_ARCH}.zip" -d duckdb-1.5

          DUCKDB_BIN="$(pwd)/duckdb-1.5/duckdb"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DUCKDB_BIN="$(cygpath -w "$(pwd)/duckdb-1.5/duckdb.exe")"
          fi
          export DUCKDB_BIN
          export DUCKDB_VERSION=v1.2.0
          chmod +x "$DUCKDB_BIN" || true
          cargo test --release -p raster_h3 --test it duckdb_sql_smoke -- --ignored

      - name: Run DuckDB 2.0.0 SQL Smoke Test
        if: matrix.cli_arch != ''
        shell: bash
        run: |
          mkdir -p duckdb-2.0
          CLI_ARCH="${{ matrix.cli_arch }}"
          if [[ "$CLI_ARCH" == "linux-aarch64" ]]; then
            CLI_ARCH="linux-arm64"
          fi
          CLI_URL="https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-${CLI_ARCH}.tar.gz"
          echo "Downloading DuckDB CLI from $CLI_URL..."
          curl --retry 5 --retry-max-time 600 --connect-timeout 30 --max-time 180 -fsSL "$CLI_URL" -o "duckdb-2.0/duckdb-cli-${CLI_ARCH}.tar.gz"
          scripts/verify_sha256.sh "duckdb-2.0/duckdb-cli-${CLI_ARCH}.tar.gz" "${{ matrix.cli_v200_sha256 }}"
          tar -xzf "duckdb-2.0/duckdb-cli-${CLI_ARCH}.tar.gz" -C duckdb-2.0

          DUCKDB_BIN="$(pwd)/duckdb-2.0/duckdb"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DUCKDB_BIN="$(cygpath -w "$(pwd)/duckdb-2.0/duckdb.exe")"
          fi
          # On the arm64 macOS runner, osx_amd64's v1.5.6 library is x86_64;
          # run the universal CLI under Rosetta so it can load it.
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" && "$(uname -m)" == "arm64" ]]; then
            printf '#!/bin/bash\nexec arch -x86_64 "%s" "$@"\n' "$DUCKDB_BIN" > duckdb-2.0/duckdb-x86
            chmod +x duckdb-2.0/duckdb-x86
            DUCKDB_BIN="$(pwd)/duckdb-2.0/duckdb-x86"
          fi
          export DUCKDB_BIN
          # The DuckDB 2.0 smoke tests exercise the v1.5.6-API build packaged above.
          # The extension platform tag can't be probed through the Rosetta
          # wrapper reliably, so pass the matrix platform explicitly.
          export DUCKDB_PLATFORM="${{ matrix.platform }}"
          if [[ "$DUCKDB_PLATFORM" == "linux_amd64_gcc4" ]]; then
            DUCKDB_PLATFORM=linux_amd64
          fi
          export DUCKDB_VERSION=v1.5.6
          export RASTER_H3_LIBRARY="$(pwd)/target-v156/${{ matrix.target }}/release/${{ matrix.lib_file }}"
          chmod +x "$DUCKDB_BIN" || true
          cargo test --release -p raster_h3 --test it duckdb_sql_smoke -- --ignored
          # Signed install/load through CREATE EXTENSION REPOSITORY (no -unsigned), plus
          # rejection of unsigned and wrong-key extensions
          cargo test --release -p raster_h3 --test it duckdb_trusted_repository -- --ignored

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-extension-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/raster_h3.duckdb_extension
            target/${{ matrix.target }}/release/raster_h3.duckdb_extension.gz
            target/${{ matrix.target }}/release/raster_h3-*.duckdb_extension
            target/${{ matrix.target }}/release/raster_h3-*.duckdb_extension.gz
            dist/**/*
          if-no-files-found: error

  # Builds through the extension-ci-tools Makefile the way duckdb/community-extensions
  # does for `build: cargo`, then runs test/sql with DuckDB's sqllogictest runner.
  community-build:
    name: Community Extension Build (linux_amd64)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-community-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: make configure release
        run: make configure release

      # extension-ci-tools skips tests on linux_amd64, so invoke its runner directly.
      - name: Run test/sql
        run: ./configure/venv/bin/python3 -m duckdb_sqllogictest --test-dir test/sql --external-extension build/release/raster_h3.duckdb_extension

  # The build matrix tests the root, core and DuckDB crates; this covers the remaining
  # workspace crates on Linux, including the pg fmgr suites behind `pg-extension`.
  test-crates:
    name: Tests (cli, datafusion, python, pg)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # The pg fmgr suites need a target major; they run against in-process stand-ins.
      RASTER_H3_PG_MAJOR: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests
        run: cargo test --release --no-fail-fast -p raster-h3-cli -p raster-h3-datafusion -p raster-h3-python -p raster-h3-pg

      - name: Run pg-extension tests
        run: cargo test --release --no-fail-fast -p raster-h3-pg --features pg-extension

  # raster-h3-sedona is a standalone workspace (DataFusion pinned to SedonaDB's version, plus
  # its Python bindings), so the --workspace jobs above never see it. The `sedona-e2e` suite is left to manual runs:
  # it compiles SedonaDB from git.
  sedona-adapter:
    name: DataFusion / SedonaDB adapter
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/raster-h3-sedona
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/raster-h3-sedona

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --no-fail-fast

      # The SedonaDB Python bindings: build the abi3 module and scan it from the sedonadb wheel.
      - name: Clippy (Python bindings)
        run: cargo clippy -p raster-h3-sedona-python --all-targets --locked -- -D warnings

      - name: Test Python bindings against sedonadb
        working-directory: crates/raster-h3-sedona/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip maturin
          .venv/bin/maturin build --release --locked --out dist
          .venv/bin/pip install dist/*.whl pytest pandas geoarrow-pyarrow "sedonadb==0.5.0"
          .venv/bin/pytest -v

  # Apache Sedona (Spark): build the `sedona` image users run (Dockerfile.sedona) and run the
  # demo's partitioned-scan pipeline under pytest in it, on real Spark with Sedona's SQL
  # functions. The tests compare every distributed result with an unpartitioned scan.
  sedona-spark:
    name: Apache Sedona (Spark) partitioned scans
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the sedona image
        run: docker build -f Dockerfile.sedona -t raster_h3-sedona:ci .

      - name: Run the Spark tests
        run: |
          docker run --rm -e SPARK_MASTER=local[2] raster_h3-sedona:ci sh -c \
            "pip3 install --no-cache-dir --break-system-packages pytest \
             && python3 -m pytest -v -p no:cacheprovider /opt/raster_h3/examples/tests"

      # Filter pushdown in raster_h3.spark needs Spark 4.1+, newer than the image's Spark 4.0:
      # install PySpark 4.1 (with its own Spark jars) beside it for these tests only.
      - name: Run the Spark 4.1 filter-pushdown tests
        run: |
          docker run --rm -e SPARK_MASTER=local[2] -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/repo:ro" raster_h3-sedona:ci sh -c \
            "pip3 install --no-cache-dir --break-system-packages pytest \
             && pip3 install --no-cache-dir --break-system-packages --target /tmp/ps41 'pyspark==4.1.*' \
             && env -u SPARK_HOME PYTHONPATH=/tmp/ps41 \
                python3 -m pytest -v -p no:cacheprovider /repo/crates/raster-h3-python/tests/spark"

  # All supply-chain checks are blocking; exceptions belong in deny.toml with a reason.
  deny:
    name: cargo-deny (${{ matrix.checks }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  metadata:
    name: Version Consistency
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_versions.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  package-check:
    name: Package core crate
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo package --locked -p raster-h3-core

  wheel-validation:
    needs: [changes]
    if: needs.changes.outputs.wheels == 'true'
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
      pull-requests: read

  safety:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/safety.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub Release
    needs: [build, lint, msrv, community-build, test-crates, sedona-adapter, sedona-spark, deny, metadata, package-check, wheel-validation, safety]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DUCKDB_EXTENSION_SIGNING_KEY: ${{ secrets.DUCKDB_EXTENSION_SIGNING_KEY }}
      DUCKDB_EXTENSION_PUBLIC_KEY: ${{ secrets.DUCKDB_EXTENSION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all extension artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-artifacts
          pattern: duckdb-extension-*
          merge-multiple: false

      - name: Download validated wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-wheels
          pattern: wheels-*
          merge-multiple: true

      # The trusted-repository manifest is only emitted for signed builds, so the
      # packager is only needed when a signing key is configured.
      - name: Set up Rust toolchain for release packaging
        if: env.DUCKDB_EXTENSION_SIGNING_KEY != ''
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: '1.97.1'

      - name: Prepare Release Assets and Repository Bundle
        shell: bash
        run: |
          mkdir -p release-assets
          mkdir -p duckdb-repository

          # Copy flat release binaries (both uncompressed and gzipped)
          find all-artifacts -name "raster_h3-*.duckdb_extension*" -exec cp {} release-assets/ \;

          # Assemble repository layout: <duckdb_version>/<platform>/raster_h3.duckdb_extension[.gz]
          # (v1.2.0 for custom_extension_repository on DuckDB 1.2, v2.0.0 for CREATE EXTENSION REPOSITORY)
          find all-artifacts -path "*/dist/v*/*" -type f | while read -r file; do
            plat=$(basename "$(dirname "$file")")
            ver=$(basename "$(dirname "$(dirname "$file")")")
            mkdir -p "duckdb-repository/$ver/$plat"
            cp "$file" "duckdb-repository/$ver/$plat/"
          done

          # Emit DuckDB 2.0's `.well-known/duckdb-extension-repo.json` only for signed builds: the
          # build job signs only when DUCKDB_EXTENSION_SIGNING_KEY is set, and a manifest that pins
          # a key over unsigned extensions makes `INSTALL ... FROM <repo>` fail verification.
          if [[ -z "${DUCKDB_EXTENSION_SIGNING_KEY:-}" && -n "${DUCKDB_EXTENSION_PUBLIC_KEY:-}" ]]; then
            echo "::warning::DUCKDB_EXTENSION_PUBLIC_KEY is set without DUCKDB_EXTENSION_SIGNING_KEY; extensions are unsigned, so no trusted repository manifest is published."
          fi
          if [[ -n "${DUCKDB_EXTENSION_SIGNING_KEY:-}" ]]; then
            cargo build --locked --release --bin package_extension
            PACKAGER=target/release/package_extension
            "$PACKAGER" --repo-manifest duckdb-repository/.well-known/duckdb-extension-repo.json

            # Every bundled and flat extension must verify against the manifest key (the public key
            # when configured, else the one derived from the signing key). This also fails the
            # release when the two configured secrets are not a matching key pair.
            find duckdb-repository/v* release-assets -type f -name "*.duckdb_extension*" -print0 |
              while IFS= read -r -d '' ext; do
                "$PACKAGER" --verify "$ext"
              done
            cp duckdb-repository/.well-known/duckdb-extension-repo.json release-assets/duckdb-extension-repo.json
            (cd duckdb-repository && zip -r ../release-assets/duckdb-extension-repository-v1.2.0.zip v* .well-known)
          else
            # Archive repository bundle for custom_extension_repository distribution
            (cd duckdb-repository && zip -r ../release-assets/duckdb-extension-repository-v1.2.0.zip v*)
          fi

          cp all-wheels/*.whl release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)

          echo "Staged release assets:"
          ls -la release-assets/

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
