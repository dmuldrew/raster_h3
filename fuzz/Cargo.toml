[package]
name = "raster-h3-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
raster-h3-core = { version = "0.5.0", path = "../crates/raster-h3-core" }
tempfile = "3.10"
tiff = "0.11"

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geotiff"
path = "fuzz_targets/geotiff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "predictor"
path = "fuzz_targets/predictor.rs"
test = false
doc = false
bench = false

# Keep in sync with the workspace `[patch.crates-io]`: this crate is its own
# workspace, so the root patch does not apply here.
[patch.crates-io]
h3o = { git = "https://github.com/dmuldrew/h3o", branch = "raster-row-indexing" }
