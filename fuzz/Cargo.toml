[package]
name = "raster-h3-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
raster-h3-core = { version = "0.5.0", path = "../crates/raster-h3-core" }
tempfile = "3.10"
tiff = "0.11"

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geotiff"
path = "fuzz_targets/geotiff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "predictor"
path = "fuzz_targets/predictor.rs"
test = false
doc = false
bench = false

# Same unreleased h3o revision as the workspace `[patch.crates-io]`; remove both together.
[patch.crates-io]
h3o = { git = "https://github.com/HydroniumLabs/h3o", rev = "49e653e2102a0f53af0930a4f12b88cd7600b832" }
