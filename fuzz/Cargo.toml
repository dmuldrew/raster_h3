[package]
name = "raster-h3-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
raster-h3-core = { version = "0.7.0", path = "../crates/raster-h3-core" }
tempfile = "3.10"
tiff = "0.11"

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geotiff"
path = "fuzz_targets/geotiff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "predictor"
path = "fuzz_targets/predictor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc"
path = "fuzz_targets/ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arrow_import"
path = "fuzz_targets/arrow_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remap"
path = "fuzz_targets/remap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_range"
path = "fuzz_targets/content_range.rs"
test = false
