# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run locally with `cargo deny check`; CI runs the same checks in the `deny` job.

[graph]
# Include feature-gated dependencies (e.g. raster-h3-pg's pg-extension) in every check.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # fxhash is unmaintained but has no known vulnerability; it is a direct dependency of
    # raster_h3 and raster-h3-core. Replacing it with rustc-hash is tracked separately.
    { id = "RUSTSEC-2025-0057", reason = "unmaintained, no vulnerability; swap for rustc-hash is a follow-up" },
    # paste is unmaintained (archived) but sound; it only arrives as a proc-macro through
    # parquet 53. Goes away when parquet is upgraded.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled in by parquet; no vulnerability" },
]

[licenses]
version = 2
# raster_h3 is MIT; every license below is permissive and compatible with shipping it.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # webpki-roots: Mozilla's CA bundle data
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# The only wildcards are the workspace crates' versionless `path = "../raster-h3-core"`
# dependencies. allow-wildcard-paths only exempts crates marked `publish = false`, which
# these are not yet, so allow them here; tighten to "deny" once the manifests set
# `publish = false` (or give the path dependencies a version).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
