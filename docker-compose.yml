services:
  raster_h3:
    build:
      context: .
      dockerfile: Dockerfile
    image: raster_h3:latest
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  viewer:
    image: python:3.11-slim
    command: python3 -u pmtiles_viewer/server.py 8080
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
