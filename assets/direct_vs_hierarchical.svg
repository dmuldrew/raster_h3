<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan / Emerald Gradient for Direct Ground Truth -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber / Rose Gradient for Naive Rollup -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- =========================================================================
       CARD 1: DIRECT PIXEL CONTAINMENT (LEFT)
       ========================================================================= -->
  <g transform="translate(30, 30)">
    <!-- Card Frame -->
    <rect width="435" height="400" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Badge -->
    <rect x="20" y="20" width="165" height="24" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="32" cy="32" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="44" y="36" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">DIRECT GROUND TRUTH</text>

    <!-- Title & Subtitle -->
    <text x="20" y="70" font-size="18" font-weight="700" fill="#f8fafc">Direct Pixel Containment</text>
    <text x="20" y="90" font-size="12" font-weight="500" fill="#94a3b8">100% True to Raster Pixels • Zero Boundary Bleed</text>

    <!-- Visual Canvas Area -->
    <rect x="20" y="105" width="395" height="195" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>

    <!-- Raster Pixel Grid Lines (Subtle) -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3">
      <line x1="60" y1="120" x2="60" y2="285" />
      <line x1="100" y1="120" x2="100" y2="285" />
      <line x1="140" y1="120" x2="140" y2="285" />
      <line x1="180" y1="120" x2="180" y2="285" />
      <line x1="220" y1="120" x2="220" y2="285" />
      <line x1="260" y1="120" x2="260" y2="285" />
      <line x1="300" y1="120" x2="300" y2="285" />
      <line x1="340" y1="120" x2="340" y2="285" />
      <line x1="380" y1="120" x2="380" y2="285" />

      <line x1="30" y1="135" x2="405" y2="135" />
      <line x1="30" y1="165" x2="405" y2="165" />
      <line x1="30" y1="195" x2="405" y2="195" />
      <line x1="30" y1="225" x2="405" y2="225" />
      <line x1="30" y1="255" x2="405" y2="255" />
    </g>

    <!-- Parent Hexagon Polygon: Center (217, 202), Radius ~75 -->
    <!-- Vertices: (217+75*cos(a), 202+75*sin(a)) for a = 0, 60, 120, 180, 240, 300 deg -->
    <polygon points="292,202 254.5,267 179.5,267 142,202 179.5,137 254.5,137"
             fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Centroid Label -->
    <text x="217" y="200" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Parent Hexagon</text>
    <text x="217" y="215" font-size="11" font-weight="500" fill="#7dd3fc" text-anchor="middle">(True Boundary)</text>

    <!-- Pixels Inside Parent (Cyan) -->
    <circle cx="180" cy="165" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="220" cy="165" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="260" cy="165" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="180" cy="195" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="220" cy="195" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="260" cy="195" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="180" cy="225" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="220" cy="225" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="260" cy="225" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="220" cy="255" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="220" cy="135" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>

    <!-- Key Critical Pixel Highlighted Near Boundary -->
    <circle cx="140" cy="165" r="6" fill="#10b981" stroke="#ecfdf5" stroke-width="2" filter="url(#glowCyan)"/>
    <line x1="140" y1="165" x2="85" y2="145" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
    <rect x="45" y="132" width="75" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="82" y="147" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Pixel (x, y)</text>

    <!-- Outside Pixels (Slate) -->
    <circle cx="100" cy="135" r="3" fill="#475569" />
    <circle cx="100" cy="195" r="3" fill="#475569" />
    <circle cx="100" cy="255" r="3" fill="#475569" />
    <circle cx="340" cy="135" r="3" fill="#475569" />
    <circle cx="340" cy="195" r="3" fill="#475569" />
    <circle cx="340" cy="255" r="3" fill="#475569" />

    <!-- Explanation Footer Box -->
    <rect x="20" y="315" width="395" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="338" font-size="12" font-weight="700" fill="#38bdf8">✓ Direct Mathematical Testing</text>
    <text x="35" y="356" font-size="11.5" font-weight="400" fill="#cbd5e1">Pixel coordinate (x,y) is tested directly inside Parent's</text>
    <text x="35" y="371" font-size="11.5" font-weight="400" fill="#cbd5e1">true polygon boundary. <tspan fill="#34d399" font-weight="600">Zero numerical distortion.</tspan></text>
  </g>

  <!-- =========================================================================
       CARD 2: HIERARCHICAL PARENT ROLLUP (RIGHT)
       ========================================================================= -->
  <g transform="translate(495, 30)">
    <!-- Card Frame -->
    <rect width="435" height="400" rx="16" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Badge -->
    <rect x="20" y="20" width="185" height="24" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="32" cy="32" r="4" fill="#fbbf24" filter="url(#glowAmber)"/>
    <text x="44" y="36" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.5">HEX APPROXIMATION</text>

    <!-- Title & Subtitle -->
    <text x="20" y="70" font-size="18" font-weight="700" fill="#f8fafc">Hierarchical Parent Rollup</text>
    <text x="20" y="90" font-size="12" font-weight="500" fill="#94a3b8">Hex-to-Hex Mapping • Aperture-7 Boundary Bleed</text>

    <!-- Visual Canvas Area -->
    <rect x="20" y="105" width="395" height="195" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>

    <!-- Parent Hexagon (Dashed Reference): Center (217, 202), Radius ~75 -->
    <polygon points="292,202 254.5,267 179.5,267 142,202 179.5,137 254.5,137"
             fill="#475569" fill-opacity="0.08" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />

    <text x="260" y="130" font-size="11" font-weight="600" fill="#94a3b8">Parent Boundary (Target)</text>

    <!-- Child Hexagons with Aperture-7 Rotation (~19.1 deg) -->
    <!-- Child 1 (Center): Center (217, 202), Radius 29 -->
    <polygon points="246,202 231.5,227 202.5,227 188,202 202.5,177 231.5,177"
             fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Child 2 (Top): Center (217, 155), Radius 29 -->
    <polygon points="246,155 231.5,180 202.5,180 188,155 202.5,130 231.5,130"
             fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Child 3 (Bottom): Center (217, 249), Radius 29 -->
    <polygon points="246,249 231.5,274 202.5,274 188,249 202.5,224 231.5,224"
             fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Child 4 (Right): Center (258, 178), Radius 29 -->
    <polygon points="287,178 272.5,203 243.5,203 229,178 243.5,153 272.5,153"
             fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Child 5 (Right-Bottom): Center (258, 226), Radius 29 -->
    <polygon points="287,226 272.5,251 243.5,251 229,226 243.5,201 272.5,201"
             fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Child 6 (Left Overlapping Boundary): Center (176, 178), Radius 29 -->
    <!-- This child crosses the Parent's left edge! -->
    <polygon points="205,178 190.5,203 161.5,203 147,178 161.5,153 190.5,153"
             fill="#ef4444" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2" />

    <!-- Overlap / Bleed Zone Highlight Area -->
    <path d="M 142,202 L 161.5,153 L 147,178 Z" fill="#f43f5e" fill-opacity="0.6" stroke="#f43f5e" stroke-width="1.5"/>

    <!-- Callout line for boundary bleed -->
    <line x1="145" y1="165" x2="85" y2="145" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2"/>
    <rect x="40" y="132" width="95" height="22" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
    <text x="87" y="147" font-size="10" font-weight="700" fill="#fecdd3" text-anchor="middle">Boundary Bleed</text>

    <!-- Child Hexagon Label -->
    <text x="176" y="182" font-size="10" font-weight="700" fill="#fecdd3" text-anchor="middle">Child</text>
    <text x="217" y="206" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Child</text>

    <!-- The Bleed Pixel -->
    <circle cx="150" cy="170" r="5.5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" filter="url(#glowAmber)"/>

    <!-- Explanation Footer Box -->
    <rect x="20" y="315" width="395" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="338" font-size="12" font-weight="700" fill="#fbbf24">⚠ Aperture-7 Angular Misalignment</text>
    <text x="35" y="356" font-size="11.5" font-weight="400" fill="#cbd5e1">Pixel assigned to Child Hex, then Child rolled into Parent.</text>
    <text x="35" y="371" font-size="11.5" font-weight="400" fill="#cbd5e1">Causes <tspan fill="#f87171" font-weight="600">boundary bleed and distorted area statistics</tspan>.</text>
  </g>
</svg>
