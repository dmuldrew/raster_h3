[package]
name = "raster_h3"
version = "0.1.0"
edition = "2021"
authors = ["raster_h3 contributors"]
description = "High-performance DuckDB extension in Rust to aggregate raster pixels to H3 hexagonal indices"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fast pure-Rust H3 indexing library
h3o = "0.6"

# Data parallelism across raster chunks
rayon = "1.10"

# Pure Rust TIFF / GeoTIFF decoder
tiff = "0.9"

# Pure Rust coordinate reference system transformation
proj4rs = "0.1"

# Zero-copy memory-mapped file I/O
memmap2 = "0.9"

# Fast non-cryptographic hasher for 64-bit integer H3 cell keys
fxhash = "0.2"

# Error handling and utility
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
libdeflater = "1.23"
parquet = { version = "53", default-features = false, features = ["flate2", "snap", "zstd", "lz4", "brotli"] }
tempfile = "3.10"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2.5"
weezl = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
