[workspace]
resolver = "2"
members = [
    ".",
    "crates/raster-h3-core",
    "crates/raster-h3-cli",
    "crates/raster-h3-duckdb",
    "crates/raster-h3-python",
    "crates/raster-h3-pg",
]
exclude = ["fuzz", "crates/raster-h3-sedona"]

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["raster_h3 contributors"]
license = "MIT"
repository = "https://github.com/dmuldrew/raster_h3"
homepage = "https://github.com/dmuldrew/raster_h3"
# Floor set by dependencies (h3o 0.11 const float math); checked by the `msrv` CI job.
rust-version = "1.94"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.dependencies]
h3o = "0.11.1"
rayon = "1.10"
tiff = "0.11"
proj4rs = { version = "0.1", features = ["esri"] }
memmap2 = "0.9"
rustc-hash = "2.1.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
libdeflater = "1.23"
parquet = { version = "60", default-features = false, features = ["flate2-rust_backend", "snap", "zstd", "lz4", "brotli"] }
tempfile = "3.10"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }
url = "2.5"
weezl = "0.2"
libc = "0.2"
crossbeam-deque = "0.8"

[package]
name = "raster_h3"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "High-performance multi-engine Rust toolkit (DuckDB, Polars, DataFusion, PostgreSQL, CLI) to aggregate raster pixels to H3 hexagonal indices"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["geospatial", "duckdb", "polars", "datafusion", "h3"]
categories = ["science::geo", "database-implementations"]
exclude = ["data/*", "assets/*", "pmtiles_viewer/debug/*", "tests/data/*"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "raster-h3"
path = "crates/raster-h3-cli/src/bin/raster_h3.rs"

[features]
default = []
# Facade re-exports of the non-DuckDB adapters. Off by default so the root cdylib
# (packaged as `raster_h3.duckdb_extension`) does not link those crates and only
# exports the DuckDB entry points.
python = ["dep:raster-h3-python"]
pg = ["dep:raster-h3-pg"]
full = ["python", "pg"]
duckdb-api-v1_5_6 = ["raster-h3-duckdb/duckdb-api-v1_5_6"]
stream-profile = ["raster-h3-core/stream-profile", "raster-h3-duckdb/stream-profile"]

[dependencies]
raster-h3-core = { version = "0.7.0", path = "crates/raster-h3-core" }
raster-h3-cli = { version = "0.7.0", path = "crates/raster-h3-cli" }
raster-h3-duckdb = { version = "0.7.0", path = "crates/raster-h3-duckdb" }
raster-h3-python = { version = "0.7.0", path = "crates/raster-h3-python", optional = true }
raster-h3-pg = { version = "0.7.0", path = "crates/raster-h3-pg", optional = true }

# Used by the bins in `src/bin/` (`package_extension`, `conus_batch_and_evict`,
# `download_burn_probability`, `inspect_tif`). All are already in `raster-h3-core`'s
# dependency graph, so listing them here adds no compile time.
flate2.workspace = true
h3o.workspace = true
libc.workspace = true
parquet.workspace = true
rayon.workspace = true
serde_json.workspace = true
tempfile.workspace = true
ureq.workspace = true

[dev-dependencies]
# Used directly by `tests/it` (never linked into the cdylib).
raster-h3-pg = { version = "0.7.0", path = "crates/raster-h3-pg" }
# Used only by `examples/`.
libdeflater.workspace = true
tiff.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
