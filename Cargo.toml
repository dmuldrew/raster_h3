[workspace]
resolver = "2"
members = [
    ".",
    "crates/raster-h3-core",
    "crates/raster-h3-cli",
    "crates/raster-h3-duckdb",
    "crates/raster-h3-datafusion",
    "crates/raster-h3-python",
    "crates/raster-h3-pg",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["raster_h3 contributors"]
license = "MIT"
repository = "https://github.com/dmuldrew/raster_h3"
homepage = "https://github.com/dmuldrew/raster_h3"
# Floor set by dependencies (url -> idna -> icu_* 2.x); checked by the `msrv` CI job.
rust-version = "1.88"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.dependencies]
h3o = "0.6"
rayon = "1.10"
tiff = "0.9"
proj4rs = { version = "0.1", features = ["esri"] }
memmap2 = "0.9"
fxhash = "0.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
libdeflater = "1.23"
parquet = { version = "60", default-features = false, features = ["flate2", "snap", "zstd", "lz4", "brotli"] }
tempfile = "3.10"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2.5"
weezl = "0.2"
libc = "0.2"
crossbeam-deque = "0.8"

[package]
name = "raster_h3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "High-performance multi-engine Rust toolkit (DuckDB, Polars, DataFusion, PostgreSQL, CLI) to aggregate raster pixels to H3 hexagonal indices"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["geospatial", "duckdb", "polars", "datafusion", "h3"]
categories = ["science::geo", "database-implementations"]
exclude = ["data/*", "assets/*", "pmtiles_viewer/debug/*", "tests/data/*"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "raster-h3"
path = "crates/raster-h3-cli/src/bin/raster_h3.rs"

[features]
default = []
stream-profile = ["raster-h3-core/stream-profile", "raster-h3-duckdb/stream-profile"]

[dependencies]
raster-h3-core = { path = "crates/raster-h3-core" }
raster-h3-cli = { path = "crates/raster-h3-cli" }
raster-h3-duckdb = { path = "crates/raster-h3-duckdb" }
raster-h3-datafusion = { path = "crates/raster-h3-datafusion" }
raster-h3-python = { path = "crates/raster-h3-python" }
raster-h3-pg = { path = "crates/raster-h3-pg" }

h3o.workspace = true
rayon.workspace = true
tiff.workspace = true
proj4rs.workspace = true
memmap2.workspace = true
fxhash.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
libdeflater.workspace = true
parquet.workspace = true
tempfile.workspace = true
ureq.workspace = true
url.workspace = true
weezl.workspace = true
libc.workspace = true
crossbeam-deque.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
