[package]
name = "raster-h3-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line utilities for raster_h3 (Arrow IPC / JSONL stdout streaming, Parquet, PMTiles, and GeoTIFF inspection)"

[lints]
workspace = true

[lib]
name = "raster_h3_cli"
crate-type = ["rlib"]

[[bin]]
name = "raster-h3-cli"
path = "src/bin/raster_h3.rs"

[dependencies]
raster-h3-core = { version = "0.4.0", path = "../raster-h3-core" }
h3o.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
parquet.workspace = true
tempfile.workspace = true
tiff.workspace = true
