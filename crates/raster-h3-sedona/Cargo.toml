[package]
name = "raster-h3-sedona"
publish = false
version = "0.5.0"
edition = "2021"
rust-version = "1.94"
authors = ["raster_h3 contributors"]
license = "MIT"
repository = "https://github.com/dmuldrew/raster_h3"
description = "Apache DataFusion / SedonaDB adapter for raster_h3 table functions and H3 scalar UDFs"

# Standalone workspace: DataFusion is pinned to SedonaDB's version, and keeping it out of
# the main workspace leaves the root Cargo.lock, `cargo deny` and `--workspace` CI untouched.
# `python` holds the SedonaDB Python bindings (built with maturin).
[workspace]
members = [".", "python"]

[lib]
name = "raster_h3_sedona"

[dependencies]
raster-h3-core = { version = "0.5.0", path = "../raster-h3-core" }
raster-h3-datafusion = { version = "0.5.0", path = "../raster-h3-datafusion" }
# Must match the DataFusion / arrow versions pinned by apache/sedona-db.
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
arrow = { version = "58.3.0", default-features = false, features = ["ffi"] }
futures = "0.3"
# Parallel polyfill in `h3_polygon_to_cells` (already used by raster-h3-core).
rayon = "1.10"
tokio = { version = "1", features = ["rt", "sync"] }
# Temporary file holding a PMTiles archive before it is uploaded to the object store.
tempfile = "3.10"
async-trait = "0.1"
serde_json = "1.0"
# Only for the `sedona-e2e` tests; pinned to the SedonaDB revision this adapter was checked against.
sedona = { git = "https://github.com/apache/sedona-db", rev = "55da508d9f5297bc06fae0ff5662e99608d7e8b1", default-features = false, features = ["geo"], optional = true }

[features]
# Run the test suite inside a real SedonaContext (slow first build: compiles SedonaDB).
sedona-e2e = ["dep:sedona"]

[dev-dependencies]
# Reads the gzipped JSON metadata of PMTiles archives in the `pmtiles` tests.
flate2 = "1"
h3o = "0.11"
# SedonaDB's extension ABI, for the `extension_abi` round-trip tests (same revision as `sedona`).
sedona-extension = { git = "https://github.com/apache/sedona-db", rev = "55da508d9f5297bc06fae0ff5662e99608d7e8b1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3.10"
tiff = "0.11"

# Keep in sync with the workspace `[patch.crates-io]`: this crate is its own
# workspace, so the root patch does not apply here.
[patch.crates-io]
h3o = { git = "https://github.com/dmuldrew/h3o", branch = "raster-row-indexing" }
