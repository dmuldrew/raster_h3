[package]
name = "raster-h3-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL extension (Set-Returning Functions and H3 scalar functions) for raster_h3"

[lints]
workspace = true

[lib]
name = "raster_h3_pg"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build the loadable PostgreSQL module (magic block, text/bytea functions, SRFs).
# Needs the target server's major version: RASTER_H3_PG_MAJOR=<n> or pg_config on PATH.
pg-extension = []

[dependencies]
raster-h3-core = { path = "../raster-h3-core" }
h3o.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiff.workspace = true
