[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "raster-h3"
version = "0.2.0"
description = "High-performance GeoTIFF/COG to H3 hexagonal aggregation for Polars, PyArrow, DuckDB, and DataFusion"
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["geospatial", "h3", "polars", "arrow", "geotiff", "pmtiles", "geoparquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pyarrow = ["pyarrow>=14.0"]

[tool.maturin]
python-source = "python"
module-name = "raster_h3._native"
bindings = "bin"
strip = true
